<style id="gci-live-map-styles">
.mapCard{position:relative}
#gciLiveMap{position:absolute;inset:0;z-index:1;background:#e9eef5}
#gciLiveMap iframe{width:100%;height:100%;border:0;display:block}
.mapCard>.mapCanvas,.mapCard>.campusLabel,.mapCard>.userPin,.mapCard>.mapTag,.mapCard>.road,.mapCard>.mapActions{z-index:2}
.mapCard.live-ready>.mapCanvas,.mapCard.live-ready>.campusLabel,.mapCard.live-ready>.userPin,.mapCard.live-ready>.mapTag,.mapCard.live-ready>.road{display:none}
.mapCard.live-ready>.mapActions{z-index:3}
.mapLiveBadge{position:absolute;left:14px;top:14px;z-index:4;background:rgba(255,255,255,.94);border:1px solid #e4e7ee;border-radius:999px;padding:7px 11px;font:700 11px/1 Poppins,sans-serif;color:#10105e;box-shadow:0 5px 16px rgba(16,16,94,.12)}
.mapLiveBadge:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#18a957;margin-right:6px;box-shadow:0 0 0 4px rgba(24,169,87,.12)}
</style>
<script id="gci-live-map-script">
(function(){
  const card=document.querySelector('.mapCard');
  if(!card||card.querySelector('#gciLiveMap'))return;
  const map=document.createElement('div'); map.id='gciLiveMap'; card.prepend(map);
  const badge=document.createElement('div'); badge.className='mapLiveBadge'; badge.textContent='Live GPS'; card.appendChild(badge);
  const fallbackCenter={lat:23.5889,lng:72.3693};
  function show(lat,lng){
    const d=.0045;
    const bbox=[lng-d,lat-d,lng+d,lat+d].join('%2C');
    const marker=lat+'%2C'+lng;
    const src='https://www.openstreetmap.org/export/embed.html?bbox='+bbox+'&layer=mapnik&marker='+marker;
    const frame=document.createElement('iframe');
    frame.title='Live attendance map'; frame.loading='eager'; frame.referrerPolicy='no-referrer-when-downgrade'; frame.src=src;
    map.replaceChildren(frame); card.classList.add('live-ready');
  }
  function locate(){
    if(!navigator.geolocation){show(fallbackCenter.lat,fallbackCenter.lng);return;}
    navigator.geolocation.getCurrentPosition(
      p=>show(p.coords.latitude,p.coords.longitude),
      ()=>show(fallbackCenter.lat,fallbackCenter.lng),
      {enableHighAccuracy:true,timeout:10000,maximumAge:15000}
    );
  }
  locate();
  const recenter=card.querySelector('.mapActions button:first-child');
  if(recenter)recenter.addEventListener('click',e=>{e.preventDefault();locate();});
})();
</script>
